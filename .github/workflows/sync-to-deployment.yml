name: Sync to Deployment Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          repository: MuhammadHammad9/aurastudy1
          token: ${{ secrets.DEPLOYMENT_PAT }}
          path: deployment

      - name: Sync files to deployment repository
        run: |
          # Sync all files from source to deployment, deleting files that no longer exist
          # Exclude sensitive files and git directory
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.env*' \
            --exclude='*.local' \
            source/ deployment/

      - name: Commit and push changes
        run: |
          cd deployment
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all changes
          git add -A
          
          # Check if there are any staged changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync from AuraStudy - ${{ github.sha }}"
            if ! git push; then
              echo "::error::Failed to push changes to deployment repository. Please check the DEPLOYMENT_PAT secret has correct permissions."
              exit 1
            fi
          fi
